version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - dari_rec_system_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - dari_rec_system_network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - dari_rec_system_network

  mysql:
    image: mysql:latest
    container_name: mysqlc
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DATABASE: dari_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - dari_rec_system_network

  airflow-webserver:
     build:
      context: .
      dockerfile: Dockerfile.airflow
     command: webserver; airflow db init;
     environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: mysql+mysqldb://admin:admin@mysqlc/dari_db
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+mysql://admin:admin@mysqlc/dari_db
     volumes:
      - ./dags:/opt/airflow/dags
     ports:
      - "8082:8080"
     depends_on:
      - redis
      - kafka
      - mysql
     networks:
      - dari_rec_system_network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: mysql+mysqldb://admin:admin@mysqlc/dari_db
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      AIRFLOW__CELERY__RESULT_BACKEND: db+mysql://admin:admin@mysqlc/dari_db
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      - airflow-webserver
      - kafka
      - mysql
    networks:
      - dari_rec_system_network



  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.master-spark
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
    depends_on:
      - kafka
    networks:
      - dari_rec_system_network

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker-spark
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
      - kafka
    networks:
      - dari_rec_system_network

volumes:
  airflow-dags-volume:
  redis-db-volume:
  mysql-data:

networks:
  dari_rec_system_network:
    driver: bridge
